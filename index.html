<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeWeb</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2.2">
</head>
<body>

    <!-- Overlay oscuro para el fondo cuando se abre el menú -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Menú Lateral (Sidebar) -->
<!-- Menú Lateral (Sidebar) -->
    <nav id="menu-principal" class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-container">
                <h2>POKEWEB</h2>
                <span class="made-by">made by jaimevxr</span>
            </div>
            <span class="close-sidebar" id="close-sidebar">&times;</span>
        </div>
        <ul>
            <li><a href="#">🏠 Global Pokédex</a></li>
            <li><a href="#">⚔️ Team Builder <span class="badge">Pronto</span></a></li>
            <li><a href="#">⚙️ Settings</a></li>
            <li><a href="#">🌐 Language (EN)</a></li>
        </ul>
    </nav>

    <header class="pokedex-header">
        <!-- Branding superior izquierdo: Lente Azul (Botón) y Logo -->
        <div class="top-left-branding">
            <div class="light-main" id="btn-menu-principal" title="Menú Principal">
                <div class="light-reflection"></div>
            </div>
            
            <div class="branding-text-lights">
                <div class="lights-small-group">
                    <div class="light-small red"></div>
                    <div class="light-small yellow"></div>
                    <div class="light-small green"></div>
                </div>
                <div class="app-name-small">POKEWEB</div>
            </div>
        </div>

        <!-- Título central del módulo actual -->
        <div class="header-principal">
            <h1>Global Pokédex</h1>
            
            <div class="busqueda-contenedor">
                <input type="text" id="buscador" placeholder="Buscar por nombre (ej. Pikachu)...">
                <button id="btn-toggle-filtros" class="btn-toggle">⚙️ Filtros</button>
            </div>
        </div>
        
        <!-- Panel de filtros oculto -->
        <div id="panel-filtros" class="panel-filtros">
            <div class="grupo-selectores">
                <select id="filtro-tipo-1">
                    <option value="todos">Cualquier Tipo</option>
                    <option value="normal">Normal</option><option value="fire">Fuego</option>
                    <option value="water">Agua</option><option value="grass">Planta</option>
                    <option value="electric">Eléctrico</option><option value="ice">Hielo</option>
                    <option value="fighting">Lucha</option><option value="poison">Veneno</option>
                    <option value="ground">Tierra</option><option value="flying">Volador</option>
                    <option value="psychic">Psíquico</option><option value="bug">Bicho</option>
                    <option value="rock">Roca</option><option value="ghost">Fantasma</option>
                    <option value="dragon">Dragón</option><option value="dark">Siniestro</option>
                    <option value="steel">Acero</option><option value="fairy">Hada</option>
                </select>

                <select id="filtro-tipo-2" disabled>
                    <option value="ninguno">Segundo Tipo (Opcional)</option>
                    <option value="normal">Normal</option><option value="fire">Fuego</option>
                    <option value="water">Agua</option><option value="grass">Planta</option>
                    <option value="electric">Eléctrico</option><option value="ice">Hielo</option>
                    <option value="fighting">Lucha</option><option value="poison">Veneno</option>
                    <option value="ground">Tierra</option><option value="flying">Volador</option>
                    <option value="psychic">Psíquico</option><option value="bug">Bicho</option>
                    <option value="rock">Roca</option><option value="ghost">Fantasma</option>
                    <option value="dragon">Dragón</option><option value="dark">Siniestro</option>
                    <option value="steel">Acero</option><option value="fairy">Hada</option>
                </select>
                
                <button id="btn-filtrar" class="btn-toggle" style="margin: 0;">Filtrar</button>
            </div>
        </div>
    </header>

    <main>
        <div id="pokedex-grid" class="grid"></div>
        <div id="cargando" class="loading-spinner">
            <div class="pokeball-loader"></div>
            <p>Cargando Pokémon...</p>
        </div>
    </main>

    <!-- Contenedor del Modal -->
    <div id="pokemon-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>
    
    <script src="app.js?v=2.2"></script>
</body>
</html>
