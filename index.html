<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeWeb</title>
    <!-- Importamos una fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="pokedex-header">
        <h1>Global Pokedex</h1>
    </header>

    <main>
        <div id="pokedex-grid" class="grid"></div>
        <div id="cargando" class="loading-spinner">
            <div class="pokeball-loader"></div>
            <p>Cargando Pokémon...</p>
        </div>
    </main>


    <!-- Contenedor del Modal (Oculto por defecto) -->
    <div id="pokemon-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div id="modal-body">
                <!-- JavaScript inyectará la imagen y los datos aquí -->
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
